name: bats-trace-macos-probe

# One-off probe of eslogger on a GitHub macOS runner: which event types exist,
# and which fields carry the pid, parent pid, executable and path.
on:
  push:
    branches: ['ci/mac-trace-probe']
    paths: ['.github/workflows/bats-trace-macos-probe.yml']

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Events this macOS supports
        run: eslogger --list-events | tr '\n' ' '
      - name: Shape of each event
        run: |
          ev="exec fork exit open stat access readlink lookup readdir chdir getattrlist"
          sudo eslogger $ev > "$RUNNER_TEMP/es.json" 2> "$RUNNER_TEMP/es.err" &
          ep=$!
          sleep 4
          bash -c 'echo $$ > "$RUNNER_TEMP/root.pid"; cd "$GITHUB_WORKSPACE"; ls .github > /dev/null; cat README.md > /dev/null; [ -e nope-nope ]; readlink /etc; /bin/echo hi > /dev/null'
          sleep 3
          sudo kill "$ep" || true
          root=$(cat "$RUNNER_TEMP/root.pid")
          echo "root pid $root"; echo "--- stderr"; head -5 "$RUNNER_TEMP/es.err"
          echo "--- events by type (whole system)"
          jq -r '.event|keys[0]' "$RUNNER_TEMP/es.json" | sort | uniq -c
          echo "--- events of the root tree: one sample per type"
          jq -c --argjson r "$root" 'select(.process.audit_token.pid==$r or .process.ppid==$r) | {t:(.event|keys[0]), pid:.process.audit_token.pid, ppid:.process.ppid, exe:.process.executable.path, ev:(.event|to_entries[0].value|del(..|.stat?)|tostring|.[0:500])}' "$RUNNER_TEMP/es.json" | awk '!seen[substr($0,1,12)]++' | head -30
        continue-on-error: true
