# agmsg environment markers — read-only DATA, never sourced.
#
# A marker is a fact about the machine that only some hosted environments have.
# On a device-approval login the client sends the ids of the markers that
# matched, and only the ids (never a value, a path or a variable name), so the
# server can tell such a machine from a terminal. Anyone can fake a marker; that
# is a matter of the service's terms, not of this file.
#
# One marker per line:  <id> <check> <argument>
#   id     ^[a-z][a-z0-9-]{0,31}$
#   check  dir = the argument is an absolute path of a directory that exists
# Blank lines and lines starting with # are ignored; a line that does not parse
# is skipped. Only markers measured on the real environment belong here.
muse dir /opt/muse/skills
