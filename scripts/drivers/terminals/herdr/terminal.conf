# agmsg terminal-driver manifest — read-only key=value DATA. NEVER sourced.
# herdr: a pane inside a herdr session. Full terminal: spawn, despawn, read the
# visible buffer (pane read), submit a prompt (agent prompt), and name a pane.
# Detection resolves THIS session's pane from the session id via `agent list`
# (the inherited HERDR_PANE_ID is NOT trusted — measured 2026-08-29).
name=herdr
backend=herdr pane
capabilities=spawn despawn peek poke name
