# agmsg terminal-driver manifest — read-only key=value DATA. NEVER sourced.
# claude-desktop: a Claude Code session running in the Claude desktop app's
# Code tab, which has no pane to peek/poke/spawn/despawn/arrange/name.
# Detection is env-only (CLAUDE_CODE_ENTRYPOINT=claude-desktop; terminal
# sessions carry CLAUDE_CODE_ENTRYPOINT=cli — measured on a live desktop
# process, 2026-10-02).
# Priority is above herdr (10) and orca (5): the entrypoint marker is
# definitive about the host even if a pane env var leaked in from elsewhere.
name=claude-desktop
priority=1
self_env_order=1
backend=Claude desktop app (Code tab)
capabilities=where
