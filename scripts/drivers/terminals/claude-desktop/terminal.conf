# agmsg terminal-driver manifest — read-only key=value DATA. NEVER sourced.
# claude-desktop: a Claude Code session running in the Claude desktop app's
# Code tab, which has no pane to peek/poke/spawn/despawn/arrange/name.
# Detection is env-only (CLAUDE_CODE_ENTRYPOINT=claude-desktop; terminal
# sessions carry CLAUDE_CODE_ENTRYPOINT=cli — measured on a live desktop
# process, 2026-10-02).
# Priority is above herdr (10) and orca (5): the entrypoint marker is
# definitive about the host even if a pane env var leaked in from elsewhere.
# exclusive=1 (#1563 review): this driver can never be a NESTED terminal
# under another driver's pane the way herdr-in-tmux can -- the entrypoint
# marker is exhaustive, not merely a hint to try first. terminal-registry.sh
# reads this to stop resolution outright on a present-but-unresolved desktop
# session instead of falling through to a stale/inherited pane env var from
# another driver (reproduced: ENTRYPOINT=claude-desktop with no session id
# and an inherited TMUX/TMUX_PANE resolved as a tmux pane without it), and to
# skip label-based pane lookup entirely when this driver is present (a stale
# team:agent label on an unrelated pane must not outrank it either).
# record_without_name=1: this driver has no `name` capability (there is no
# pane to rename) but still wants its placement recorded, so team.sh reports
# it as claude-desktop rather than unknown:no_placement_record.
exclusive=1
record_without_name=1
name=claude-desktop
priority=1
self_env_order=1
backend=Claude desktop app (Code tab)
capabilities=where
