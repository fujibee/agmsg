# agmsg terminal-driver manifest — read-only key=value DATA. NEVER sourced.
# orca: a terminal hosted by the Orca multi-agent IDE (github.com/stablyai/orca).
# Detection is env-only (ORCA_TERMINAL_HANDLE, corroborated by TERM_PROGRAM=Orca).
# Lower priority than herdr (10) so that when a seat's environment carries BOTH
# (a herdr-hosted pane nested inside an Orca-hosted one, or any other overlap),
# orca's own env var wins — decided 2026-09-23: judge presence from the seat's
# own environment, and ORCA_TERMINAL_HANDLE present means orca.
# PR1 is read-only: detect/check/describe/where/pane_state/peek only.
# spawn/despawn/poke/name/arrange land in a later PR.
name=orca
priority=5
backend=orca terminal pane
capabilities=peek where
