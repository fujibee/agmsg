# agmsg terminal-driver manifest — read-only key=value DATA. NEVER sourced.
# plain: an OS terminal window (iTerm/Terminal/gnome-terminal/wt/template) with
# no addressable pane. It can open a place to launch a member, but the result is
# not a pane we can read, poke, or kill — so peek/poke/despawn/name are
# unsupported. It is the detection fallback: when neither tmux nor herdr matches,
# plain always resolves, so terminal resolution never fails.
name=plain
backend=OS terminal window (no addressable pane)
# Space-separated capability set, tested via agmsg_terminal_has. plain can only
# spawn (open a window); it has no pane to read/poke/kill/name.
capabilities=spawn
