# agmsg terminal-driver manifest — read-only key=value DATA. NEVER sourced.
# plain: the detection fallback, with no addressable pane. When neither tmux nor
# herdr claims the session, plain always resolves so resolution never fails; but
# it has no pane, so spawn/despawn/peek/poke/name are all unsupported and it
# advertises no capabilities. The OS-terminal launch stays in spawn.sh (see
# plain/ops.sh header).
name=plain
backend=OS terminal window (no addressable pane)
# Space-separated capability set, tested via agmsg_terminal_has. plain spawns an
# OS terminal window and "despawns" (no-op — the window closes with its process);
# it has no addressable pane for peek/poke/name.
capabilities=spawn despawn
