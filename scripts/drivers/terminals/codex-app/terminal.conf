# Desktop conversations have no pane. Their definitive host marker must
# outrank inherited pane environments and label lookups.
exclusive=1
record_without_name=1
# A new chat for a role takes it over from an older one (actas-claim.sh); there
# is no pane whose liveness could make the older chat "holding" the role.
actas_takeover=1
name=codex-app
priority=1
self_env_order=1
backend=Codex desktop app
capabilities=where
