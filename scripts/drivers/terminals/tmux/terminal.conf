# agmsg terminal-driver manifest — read-only key=value DATA. NEVER sourced.
# tmux: a pane/window inside a tmux server. Full terminal: spawn, despawn, read
# the visible buffer (capture-pane), send keystrokes (send-keys), and title a
# pane. Detection is env-only ($TMUX / $TMUX_PANE).
name=tmux
priority=20
self_env_order=10
backend=tmux pane/window
capabilities=spawn despawn peek poke where arrange name
# The CLI this driver runs. agmsg daemon start records the directory it is
# found in so agmsgd, started by launchd/systemd with a minimal PATH, can
# run it too (scripts/daemon/tool-path.mjs).
bin=tmux
