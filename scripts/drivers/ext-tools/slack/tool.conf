# agmsg ext-tool manifest — read-only key=value DATA. NEVER sourced.
name=slack
# handle posts to a fixed channel and returns quickly; 30s covers a slow
# workspace without holding up the sender for long (design note §3).
timeout=30
# Keys this tool's member config
# (~/.agents/skills/agmsg/ext-tools/<team>/<name>.conf) must carry, space
# separated. key_file names where the bot token lives (never the token
# itself, per §3); channel is where handle posts.
required_config=key_file channel
# Declares that this tool is willing to receive a natural-language request,
# not just a body meant to be posted verbatim. NOT INTERPRETED TODAY -- handle
# still posts the body exactly as given, unchanged. This is a declaration
# only, so that a later interpreter step (call a model once, turn the request
# into what actually gets posted) has somewhere to hang off of without a
# tool.conf format change when that day comes.
request=loose
