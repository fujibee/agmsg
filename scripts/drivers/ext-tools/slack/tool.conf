# agmsg ext-tool manifest — read-only key=value DATA. NEVER sourced.
name=slack
# handle posts to a fixed channel and returns quickly; 30s covers a slow
# workspace without holding up the sender for long (design note §3).
timeout=30
# Keys this tool's member config
# (~/.agents/skills/agmsg/ext-tools/<team>/<name>.conf) must carry, space
# separated. key_file names where the bot token lives (never the token
# itself, per §3); channel is where handle posts.
required_config=key_file channel
