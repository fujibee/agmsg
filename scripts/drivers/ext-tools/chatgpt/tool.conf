# agmsg ext-tool manifest — read-only key=value DATA. NEVER sourced.
name=chatgpt
# A ChatGPT web reply can take tens of seconds; with recovery slack
# (reload, retry-click, one judge call) 300s covers ordinary traffic.
# Replies longer than this are reported as failures by the dispatcher.
timeout=300
# Keys this tool's member config
# (~/.agents/skills/agmsg/ext-tools/<team>/<name>.conf) must carry, space
# separated. worktree names the Orca worktree whose built-in browser hosts
# the ChatGPT tab (stored as a path; passed to orca as path:<worktree>).
# Optional keys: url_regex (default 'chatgpt\.com' -- pin one conversation
# with 'chatgpt\.com/c/<id>'), page (a browserPageId pin, verified then
# falling back to url_regex), mode (sync-wait|inject-only, default
# sync-wait), judge_member (name of a jev member in the same team, used to
# arbitrate ambiguous page states; unset = heuristics only).
required_config=worktree
