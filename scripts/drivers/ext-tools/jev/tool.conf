# agmsg ext-tool manifest — read-only key=value DATA. NEVER sourced.
name=jev
# A decision endpoint answers in well under a second (measured 0.18-0.30s
# via OpenRouter, 0.333s via TypeSafe direct -- same order of magnitude
# either way), but this budget covers the whole of `handle`, not only the
# request: on native Windows (Git Bash) handle alone was measured at about 10s
# (#1584). 30s leaves room for the request's own 25s curl max-time (_lib.sh)
# on top of that, though not for both at their worst.
timeout=30
# Keys this tool's member config
# (~/.agents/skills/agmsg/ext-tools/<team>/<name>.conf) must carry, space
# separated. key_file names where the provider's API key lives (never the
# key itself, per §3) -- OpenRouter's or TypeSafe's, whichever this
# member's own provider= names (see handle, USAGE.md).
required_config=key_file
