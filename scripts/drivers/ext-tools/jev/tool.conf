# agmsg ext-tool manifest — read-only key=value DATA. NEVER sourced.
name=jev
# OpenRouter's decision endpoint answers in well under a second (measured
# 0.18-0.30s); 10s covers network jitter without holding up the sender.
timeout=10
# Keys this tool's member config
# (~/.agents/skills/agmsg/ext-tools/<team>/<name>.conf) must carry, space
# separated. key_file names where the OpenRouter API key lives (never the
# key itself, per §3).
required_config=key_file
# Example question type used when the message body is plain text and no
# question is named in the request (see examples/, handle). examples/ is a
# working sample, not a fixed catalog -- an OSS driver is expected to grow
# its own.
default_question=route
