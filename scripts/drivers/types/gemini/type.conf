# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
name=gemini
priority=1000
template=template.md
cli=gemini
spawnable=yes
# gemini invokes a skill with "$", not Claude Code's "/" (see spawn.sh, #283).
cmd_prefix=$
model_arg=--model
detect=GEMINI_CLI
detect_fallback=GEMINI_API_KEY
detect_proc=gemini gemini-*
hooks_file=.agent/rules/agmsg.md
readiness_sentinel=no
delivery_modes=turn off
