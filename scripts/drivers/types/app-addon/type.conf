# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
#
# app-addon: a member that an add-on of the agmsg desktop app registers for
# itself. It is not a CLI agent: the add-on owns its own send/receive, so
# there is no PTY to launch and no agmsg-side delivery.
name=app-addon
spawnable=no
readiness_sentinel=no
delivery_modes=off
