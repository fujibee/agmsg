# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
name=antigravity
template=template.md
cli=agy
spawnable=yes
# antigravity invokes a skill with "$", not Claude Code's "/" (see spawn.sh, #283).
cmd_prefix=$
model_arg=--model
prompt_arg=--prompt-interactive
detect=explicit
hooks_file=.agent/rules/agmsg.md
readiness_sentinel=no
delivery_modes=monitor turn off
# poke.sh's own draft-safety check (#1321): before typing, confirm the input
# box is empty. Antigravity's idle prompt is a bare ">" line boxed between
# two 20+-char horizontal-rule lines (measured live, 2026-11-13). A
# confirmation screen ("Allow access to this file? > 1. Yes, allow access")
# also has a line starting with "> " but is NOT bounded by a rule-line pair
# around it (the nearest rule pair above it only wraps a "File access"
# header) -- agmsg_input_box_locate's own "between the LAST rule-line pair"
# scope therefore reports it as box_not_found rather than matching the
# option line, which is the point: poke must refuse a confirmation screen
# (box_not_found, held pending), not type an answer into it.
input_prompt_marker=>
input_prompt_boxed=yes
# Antigravity draws its idle-box placeholder ("Auto mode: edits & safe
# commands auto-approved …") in ESC[38;5;8m (256-color index 8), not SGR 2
# like every other type's placeholder -- without this, the plain two-code
# dim check reads that text as a real draft and refuses every idle seat
# (measured live via herdr, 2026-11-13; tmux's own two-snapshot-only check
# does not need this, since it never classifies by style at all).
input_placeholder_style=38;5;8
