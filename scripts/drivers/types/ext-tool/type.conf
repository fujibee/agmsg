# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
#
# ext-tool: a program, not a human or an AI CLI, is the member. A message sent
# to one runs a small per-tool adapter (scripts/drivers/ext-tools/<tool>/handle)
# once and sends its output back as the reply — there is no PTY, no session,
# and nothing for agmsg to deliver into.
name=ext-tool
spawnable=no
readiness_sentinel=no
delivery_modes=off
