# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
#
# muse: the Muse personal-agent runtime (Meta). It is not a CLI agent:
# the agent runs in its own environment with a shell and drives agmsg
# purely through the scripts (send.sh / inbox.sh / check-inbox.sh), so
# there is no PTY to launch and no agmsg-side delivery — arrival
# notification is the runtime's own concern.
name=muse
spawnable=no
readiness_sentinel=no
delivery_modes=off
