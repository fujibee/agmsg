# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
name=devin
template=template.md
cli=devin
spawnable=yes
# Devin's REPL takes an initial prompt only after a `--` end-of-options
# separator (`devin -- "prompt"`, `devin --model <id> -- "prompt"`): a bare
# positional reads as a subcommand, and -p/--print is the one-shot mode a
# spawned seat must not use. prompt_arg emits the separator verbatim,
# immediately before the quoted prompt — same mechanism the flag-shaped
# prompt_arg values use, no devin-specific branch in spawn.
prompt_arg=--
model_arg=--model
detect_proc=devin devin-*
readiness_sentinel=no
delivery_modes=off
