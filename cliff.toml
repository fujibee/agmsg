# git-cliff configuration — generates CHANGELOG.md and GitHub Release notes
# from Conventional Commits. Output follows the Keep a Changelog format.
#
# Local:  git-cliff --tag "v$(cat VERSION)" -o CHANGELOG.md   (rewrite full file)
#         git-cliff --latest --strip header                   (just newest release, for release notes)
# CI:     orhun/git-cliff-action in .github/workflows/release.yml
#
# PR numbers like "(#123)" already live in the commit subjects and GitHub
# auto-links them in CHANGELOG.md and Release notes, so no token/remote
# integration is needed here. Curate contributor shout-outs by hand for
# notable releases.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}\
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}
    {% endfor %}\
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/fujibee/agmsg/compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/fujibee/agmsg/releases/tag/{{ release.version }}
        {% endif -%}
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Don't auto-drop non-conventional commits — some notable community PRs were
# squash-merged with their PR title as-is (no `feat:`/`fix:` prefix). Instead we
# classify explicitly below and the catch-all rule skips everything unmatched,
# so the log stays curated rather than flooded with merges/initial commits.
filter_unconventional = false
split_commits = false
# Conventional types → Keep a Changelog sections. The `<!-- N -->` prefixes only
# drive section ordering; `striptags` removes them from the rendered heading.
commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^release", skip = true },
  { message = "^(chore|ci|build|test|style)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
  # Headline community PRs merged with non-conventional squash subjects:
  { message = "(?i)native windows", group = "<!-- 0 -->Added" },
  { message = "(?i)powershell launcher", group = "<!-- 0 -->Added" },
  { message = "(?i)sandboxed bash tool", group = "<!-- 1 -->Fixed" },
  { message = "^Role-to-session affinity", group = "<!-- 0 -->Added" },
  { message = "^Stop ancestor project resolution", group = "<!-- 1 -->Fixed" },
  { message = "^Fix Codex monitor multi-identity delivery", group = "<!-- 1 -->Fixed" },
  { message = "^Isolate Codex monitor bridges by role", group = "<!-- 0 -->Added" },
  { message = "^Allow launcher-reserved bridge PID", group = "<!-- 1 -->Fixed" },
  { message = "^Stop telling every agent that key rotate", group = "<!-- 1 -->Fixed" },
{ message = "^Naming is an invariant every entry point re-asserts", group = "<!-- 0 -->Added" },
{ message = "^spawn: launch codex through the bundled monitor shim", group = "<!-- 1 -->Fixed" },
{ message = "^Remove internal handles from the published tree", group = "<!-- 3 -->Changed" },
{ message = "^sync-cipher: tolerate unknown message fields on receive", group = "<!-- 1 -->Fixed" },
{ message = "^codex: one app-server per seat, never shared", group = "<!-- 1 -->Fixed" },
{ message = "^plain driver: an agent-native substitute for peek/poke with no pane", group = "<!-- 0 -->Added" },
  # 1.4.0's jev work was squashed with a "jev:" subject rather than a
  # Conventional prefix, so the catch-all below would drop it — including the
  # second provider, the most user-visible jev change in the release. Same
  # remedy as the community-PR lines above.
  { message = "^jev: add TypeSafe as a second provider", group = "<!-- 0 -->Added" },
  { message = "^jev: report each question's own confidence", group = "<!-- 1 -->Fixed" },
  { message = "^jev: promote batching multiple questions", group = "<!-- 4 -->Documentation" },
  { message = "^jev: fix tool.conf comments", group = "<!-- 4 -->Documentation" },
  { message = "^jev, ext-tool README", group = "<!-- 4 -->Documentation" },
  # 1.4.1's squash subjects that don't start with a type this file already
  # recognizes: "install:" and "poke(herdr):" aren't Conventional Commits
  # types, and "Add SECURITY.md..." carries no prefix at all. Same remedy as
  # the community-PR and jev lines above. Grouped to match the classification
  # already published in the real 1.4.1 CHANGELOG.md.
  { message = "^Add SECURITY.md and Dependabot config", group = "<!-- 0 -->Added" },
  { message = "^poke\\(herdr\\): use focus to deliver past an abandoned draft", group = "<!-- 0 -->Added" },
  { message = "^install: add ext-tools/ to Codex sandbox writable_roots", group = "<!-- 1 -->Fixed" },
  { message = "^install: prune scripts/ files a prior release no longer ships", group = "<!-- 3 -->Changed" },
  # General fallback for the NEXT install:/poke:-prefixed commit this file
  # hasn't seen yet -- otherwise it silently drops again, same failure mode
  # as today. Placed below the individual overrides above so a future commit
  # matching one of those exact subjects still gets its specific group; only
  # an unmatched install:/poke: subject falls through to here. No fallback
  # for a headerless subject like "Add SECURITY.md..." -- that shape is too
  # generic to default anywhere without curating it by hand, same reasoning
  # the file already applies to the community-PR and jev lines above.
  { message = "^install(\\(.*\\))?:", group = "<!-- 3 -->Changed" },
  { message = "^poke(\\(.*\\))?:", group = "<!-- 3 -->Changed" },
  # Everything else (merges, initial commit, misc) is intentionally dropped.
  { message = ".*", skip = true },
]
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"
